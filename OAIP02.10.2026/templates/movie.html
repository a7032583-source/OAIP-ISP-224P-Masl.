<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
</head>
<body>

<h1>{{ movie.title }}</h1>

<p>Год выпуска: {{ movie.year }}</p>
<p>Рейтинг: {{ movie.rating }}</p>
<p>жанр: {{ movie.genre }}</p>

{% if movie.rating > 8.5 %}

{% endif %}


<a href="/">Назад</a>

</body>
</html>
