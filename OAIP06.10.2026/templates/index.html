<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильмы</title>
</head>
<body>

<h1>Каталог фильмов</h1>

<a href="/favorites">
    Избранное ({{ favorites_count }})
</a>


<hr>

{% for movie in movies %}

    <h2>{{ movie.title }}</h2>

    <p>Год выпуска: {{ movie.year }}</p>
    <p>жанр : {{ movie.genre }}</p>
    <p>рейтинг : {{ movie.rating }}</p>
    {% if movie.id in favorites %}
        <p>✓ Уже в избранном</p>
    {% else %}
        <a href="/add/{{ movie.id }}">
            Добавить в избранное
        </a>
    {% endif %}
    <hr>

{% endfor %}

</body>
</html>
